<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PR 리뷰</title>
<style>
:root {
  --bg: #ffffff; --bg-subtle: #f6f8fa; --bg-hover: #eff2f5; --border: #d1d9e0; --border-muted: #e4e8ec;
  --fg: #1f2328; --fg-muted: #59636e;
  --accent: #0969da; --accent-subtle: #ddf4ff; --on-accent: #ffffff;
  --diff-add: #dafbe1; --diff-add-num: #aceebb; --diff-del: #ffebe9; --diff-del-num: #ffcecb; --diff-hl: #fff8c5;
  --bug: #d1242f; --sug: #1a7f37; --ask: #9a6700; --nit: #59636e;
  --bug-subtle: #ffebe9; --sug-subtle: #dafbe1; --ask-subtle: #fff8c5; --nit-subtle: #eff2f5;
  --font: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  --code: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --bg-subtle: #151b23; --bg-hover: #1c232c; --border: #3d444d; --border-muted: #2a3038;
    --fg: #f0f6fc; --fg-muted: #9198a1;
    --accent: #4493f8; --accent-subtle: #121d2f; --on-accent: #ffffff;
    --diff-add: #12261e; --diff-add-num: #1b4428; --diff-del: #25171c; --diff-del-num: #542426; --diff-hl: #2e2a1a;
    --bug: #f85149; --sug: #3fb950; --ask: #d29922; --nit: #9198a1;
    --bug-subtle: #25171c; --sug-subtle: #12261e; --ask-subtle: #2e2a1a; --nit-subtle: #1c232c;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.app { height: 100%; display: flex; flex-direction: column; }
.muted { color: var(--fg-muted); }
.spacer { flex: 1; }

/* 헤더와 아래 막대 */
header {
  flex: none; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  border-bottom: 1px solid var(--border); background: var(--bg);
}
header h1 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
header h1 .num { color: var(--fg-muted); font-weight: 400; margin-right: 6px; }
header .meta { color: var(--fg-muted); white-space: nowrap; }
.statusbar {
  flex: none; display: flex; gap: 16px; align-items: center; padding: 6px 16px; border-top: 1px solid var(--border);
  background: var(--bg-subtle); color: var(--fg-muted); font-size: 12px; flex-wrap: wrap;
}
kbd {
  display: inline-block; min-width: 18px; text-align: center; font: 11px/16px var(--code); padding: 0 4px; margin-right: 2px;
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; background: var(--bg); color: var(--fg);
}
.btn {
  height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-subtle);
  cursor: pointer; white-space: nowrap; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.primary kbd { background: transparent; border-color: rgba(255,255,255,.45); color: inherit; }
.notice { color: var(--bug); font-size: 12px; }

/* PR 목록 */
.scroll { flex: 1; overflow: auto; }
.list { max-width: 1040px; margin: 0 auto; padding: 8px 16px 24px; }
.section { display: flex; align-items: center; gap: 8px; padding: 16px 8px 6px; font-size: 12px; font-weight: 600; color: var(--fg-muted); }
.count { font-weight: 500; font-size: 11px; padding: 0 6px; border-radius: 10px; background: var(--bg-hover); color: var(--fg-muted); }
.pr {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) 120px 76px 92px; gap: 12px; align-items: center;
  height: 36px; padding: 0 8px; border-radius: 6px; cursor: pointer;
}
.pr:hover { background: var(--bg-subtle); }
.pr.active { background: var(--accent-subtle); box-shadow: inset 2px 0 0 var(--accent); }
.pr .num { color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.pr .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.pr .author, .pr .when { color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr .size { font: 12px var(--code); text-align: right; white-space: nowrap; }
.plus { color: var(--sug); } .minus { color: var(--bug); }

/* 상태 화면 */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 40px; text-align: center; }
.center h2 { margin: 0; font-size: 15px; font-weight: 600; }
.center p { margin: 0; color: var(--fg-muted); max-width: 520px; }
.center a { color: var(--accent); word-break: break-all; text-decoration: none; }
.center a:hover { text-decoration: underline; }
.center.error h2 { color: var(--bug); }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.mark { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 700; color: #fff; background: var(--sug); }
.center.error .mark { background: var(--bug); }

/* 피드백 편집 */
main { flex: 1; min-height: 0; display: flex; }
.items { width: 280px; flex: none; overflow: auto; border-right: 1px solid var(--border); background: var(--bg-subtle); padding: 4px 8px 16px; }
.item {
  display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: center;
  height: 30px; padding: 0 8px; border-radius: 6px; cursor: pointer;
}
.item:hover { background: var(--bg-hover); }
.item.active { background: var(--accent-subtle); box-shadow: inset 2px 0 0 var(--accent); }
.item.off { color: var(--fg-muted); }
.item.off .loc { text-decoration: line-through; }
.item input { margin: 0; width: 14px; height: 14px; accent-color: var(--accent); }
.loc { font: 12px var(--code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.loc .line { color: var(--fg-muted); }
.sev { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.badge { font-size: 11px; font-weight: 600; padding: 0 7px; line-height: 18px; border-radius: 10px; white-space: nowrap; }
.버그 { --sev: var(--bug); --sev-subtle: var(--bug-subtle); }
.제안 { --sev: var(--sug); --sev-subtle: var(--sug-subtle); }
.질문 { --sev: var(--ask); --sev-subtle: var(--ask-subtle); }
.사소 { --sev: var(--nit); --sev-subtle: var(--nit-subtle); }
.dot { background: var(--sev); }
.badge { color: var(--sev); background: var(--sev-subtle); }

.detail { flex: 1; min-width: 0; overflow: auto; padding: 16px; }
.file { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--bg); }
.file-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-subtle); border-bottom: 1px solid var(--border); font: 12px var(--code); }
.diff { width: 100%; border-collapse: collapse; font: 12px/20px var(--code); }
.diff td { padding: 0 10px; white-space: pre; vertical-align: top; }
.diff td.no { width: 1%; min-width: 44px; text-align: right; color: var(--fg-muted); user-select: none; padding: 0 8px; }
.diff td.sign { width: 1%; padding: 0 4px 0 8px; user-select: none; color: var(--fg-muted); }
.diff tr.add td { background: var(--diff-add); }
.diff tr.add td.no { background: var(--diff-add-num); }
.diff tr.del td { background: var(--diff-del); }
.diff tr.del td.no { background: var(--diff-del-num); }
.diff tr.hl td { background: var(--diff-hl); }
.diff tr.hl td.no { box-shadow: inset 3px 0 0 var(--accent); }
.diff tr.hunk td { background: var(--accent-subtle); color: var(--fg-muted); padding: 2px 10px; }
.diff tr.gap td { background: var(--bg-subtle); color: var(--fg-muted); text-align: center; padding: 2px; font-family: var(--font); font-size: 12px; }
.diff tr.slot > td { padding: 8px 12px 10px 60px; white-space: normal; background: var(--bg-subtle); border-top: 1px solid var(--border-muted); border-bottom: 1px solid var(--border-muted); font-family: var(--font); }

.card {
  border: 1px solid var(--border); border-left: 3px solid var(--sev); border-radius: 6px; background: var(--bg);
  font: 13px/1.6 var(--font); max-width: 880px;
}
.card.editing { border-color: var(--accent); border-left-color: var(--sev); }
.card.off { opacity: .55; }
.card-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; font-size: 12px; }
.card-head .off-tag { color: var(--fg-muted); }
.card-body { padding: 6px 12px 10px; white-space: pre-wrap; word-break: break-word; cursor: text; }
.card-body.empty { color: var(--fg-muted); }
.card-body code, .center code { font: 12px var(--code); padding: 1px 5px; border-radius: 4px; background: var(--bg-hover); }
.sugg { margin: 0 12px 12px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.sugg-head { padding: 4px 10px; font-size: 12px; color: var(--fg-muted); background: var(--bg-subtle); border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
.sugg .diff td.no { min-width: 0; }
.sugg-empty { margin: 0 12px 10px; color: var(--fg-muted); font-size: 12px; cursor: text; }
.card textarea {
  display: block; width: calc(100% - 24px); margin: 6px 12px 10px; resize: none; overflow: hidden; border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; background: var(--bg); line-height: 1.6;
}
.card textarea.codebox { font: 12px/20px var(--code); white-space: pre; overflow-x: auto; }
.card textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.card-foot { padding: 0 12px 8px; font-size: 12px; color: var(--fg-muted); }

.bottom { flex: none; border-top: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 16px; align-items: flex-start; background: var(--bg); }
.bottom label { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; }
.bottom textarea {
  resize: vertical; min-height: 36px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
  background: var(--bg); font-weight: 400; line-height: 1.6;
}
.bottom textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.result { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { height: 28px; padding: 0 10px; border: 0; border-right: 1px solid var(--border); background: var(--bg); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-subtle); color: var(--accent); font-weight: 600; }
.seg button:disabled { color: var(--fg-muted); opacity: .5; cursor: default; }
.seg .rec { font-size: 10px; color: var(--fg-muted); font-weight: 400; }
.empty-state { color: var(--fg-muted); padding: 48px 24px; text-align: center; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
'use strict';

const SEVERITIES = ['버그', '제안', '질문', '사소'];
const EVENTS = [
  { value: 'COMMENT', label: '코멘트' },
  { value: 'REQUEST_CHANGES', label: '변경 요청' },
  { value: 'APPROVE', label: '승인' },
];
const CONTEXT = 10; // 강조한 줄 앞뒤로 보여 줄 줄 수
const TERMINAL = ['done', 'error', 'closed'];

let state = null;      // 서버에서 받은 마지막 상태
let version = 0;
let cursor = 0;        // PR 목록에서 고른 위치(화면 순서 기준)
let draft = null;      // 피드백 편집 내용. 게시할 때 한 번에 보낸다
let notice = '';
let polling = null;

// ------------------------------------------------------------ DOM 도우미

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (key === 'value' || key === 'checked' || key === 'disabled') node[key] = value;
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

const kbd = (...names) => names.map(n => el('kbd', {}, n));
const hint = (keys, text) => el('span', {}, ...keys, ' ', text);
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const MOD = isMac ? '⌘' : 'Ctrl';
const basename = path => path.split('/').pop();

// 본문의 `코드`를 code 요소로 바꾼다. 나머지는 글자 그대로 넣는다.
function inline(text) {
  return text.split(/(`[^`\n]+`)/).map(part =>
    part.length > 2 && part.startsWith('`') && part.endsWith('`') ? el('code', {}, part.slice(1, -1)) : part);
}

function ago(iso) {
  const t = Date.parse(iso || '');
  if (Number.isNaN(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return '방금';
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)}일 전`;
  return new Date(t).toISOString().slice(0, 10);
}

// ------------------------------------------------------------ 서버

async function post(name, body) {
  const res = await fetch('api/' + name, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const value = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(value.error || '요청이 거부되었습니다.');
  return value;
}

async function poll() {
  try {
    const res = await fetch('api/state', { cache: 'no-store' });
    if (!res.ok) throw new Error(String(res.status));
    const next = await res.json();
    if (next.version !== version) {
      version = next.version;
      enter(next);
    }
  } catch (e) {
    if (!state || !TERMINAL.includes(state.phase)) {
      enter({ phase: 'closed', message: '리뷰 페이지 서버가 종료되었습니다.' });
    }
    stop();
  }
}

function stop() {
  if (polling) clearInterval(polling);
  polling = null;
}

function enter(next) {
  state = next;
  if (next.phase === 'feedback' && (!draft || draft.number !== next.number)) {
    draft = makeDraft(next.review);
  }
  if (TERMINAL.includes(next.phase)) stop();
  notice = '';
  render();
}

// ------------------------------------------------------------ 편집 내용

function makeDraft(review) {
  const order = review.items
    .map((item, i) => ({ item, i }))
    .sort((a, b) => SEVERITIES.indexOf(a.item.severity) - SEVERITIES.indexOf(b.item.severity) || a.i - b.i)
    .map(x => x.item);
  const d = {
    number: review.number,
    order,           // 목록에 보이는 순서
    cursor: 0,
    editing: null,   // null, 'body', 'suggestion'
    selected: {}, bodies: {}, suggestions: {},
    summary: review.summary || '',
    event: review.isOwnPr ? 'COMMENT' : (review.recommendedEvent || 'COMMENT'),
  };
  for (const item of review.items) {
    d.selected[item.id] = item.severity !== '사소';
    d.bodies[item.id] = item.body || '';
    d.suggestions[item.id] = item.suggestion || '';
  }
  return d;
}

const current = () => draft.order[draft.cursor];
const chosen = () => draft.order.filter(item => draft.selected[item.id]);

async function publish() {
  if (!state || state.phase !== 'feedback') return;
  const items = chosen();
  const summary = draft.summary.trim();
  if (!items.length && !summary) {
    return say('게시할 내용이 없습니다. 피드백을 하나 이상 고르거나 전체 의견을 써 주세요.');
  }
  const blank = items.find(item => !draft.bodies[item.id].trim());
  if (blank) {
    draft.cursor = draft.order.indexOf(blank);
    draft.editing = null;
    render();
    return say('본문이 비어 있는 피드백이 있습니다. 본문을 쓰거나 선택을 해제해 주세요.');
  }
  try {
    await post('publish', {
      event: state.review.isOwnPr ? 'COMMENT' : draft.event,
      summary,
      comments: items.map(item => ({ id: item.id, body: draft.bodies[item.id], suggestion: draft.suggestions[item.id] })),
    });
    await poll();
  } catch (e) {
    say(e.message);
  }
}

async function cancel() {
  try { await post('cancel'); await poll(); } catch (e) { say(e.message); }
}

async function closePage() {
  try { await post('close'); await poll(); } catch (e) { say(e.message); }
}

async function select(number) {
  try { await post('select', { number }); await poll(); } catch (e) { say(e.message); }
}

function say(text) {
  notice = text;
  const box = document.getElementById('notice');
  if (box) box.textContent = text;
}

// ------------------------------------------------------------ 화면

function render() {
  const app = document.getElementById('app');
  const active = document.activeElement;
  const focusId = active && active.id;
  app.replaceChildren(...screen());
  document.title = state && state.number ? `#${state.number} 리뷰` : 'PR 리뷰';
  if (draft && draft.editing && state.phase === 'feedback') {
    focusEnd(draft.editing === 'body' ? 'body' : 'suggestion');
  } else if (focusId && document.getElementById(focusId)) {
    document.getElementById(focusId).focus();
  }
  const row = app.querySelector('.pr.active, .item.active');
  if (row) row.scrollIntoView({ block: 'nearest' });
  const slot = app.querySelector('tr.slot');
  if (slot) slot.scrollIntoView({ block: 'nearest' });
}

function prTitle() {
  const title = state.title || (state.review && state.review.title) || '';
  const author = state.review && state.review.author;
  return [
    el('h1', {}, state.number ? el('span', { class: 'num' }, `#${state.number}`) : null, title || 'PR 리뷰'),
    author ? el('span', { class: 'meta' }, author) : null,
  ];
}

function screen() {
  if (!state) return [el('div', { class: 'center' }, el('div', { class: 'spinner' }))];
  switch (state.phase) {
    case 'list': return listScreen();
    case 'reviewing': return waitScreen('변경 사항을 읽고 있습니다',
      'Claude가 diff를 끝까지 읽고 피드백을 쓰는 중입니다. 다 쓰면 이 화면이 피드백 편집 화면으로 바뀝니다.', true);
    case 'feedback': return feedbackScreen();
    case 'posting': return waitScreen('GitHub에 게시하고 있습니다', '잠시만 기다려 주세요.', false);
    case 'done': return doneScreen();
    case 'error': return endScreen('게시하지 못했습니다', state.message, true);
    default: return endScreen('리뷰를 마쳤습니다', state.message || '리뷰 페이지 서버가 종료되었습니다.', false);
  }
}

// ------------------------------------------------------------ PR 목록

function prSections() {
  const byTime = (a, b) => (Date.parse(b.updatedAt || '') || 0) - (Date.parse(a.updatedAt || '') || 0);
  const prs = state.prs || [];
  return [
    { title: '나에게 리뷰 요청됨', prs: prs.filter(p => p.isReviewRequested).sort(byTime) },
    { title: '그 밖의 PR', prs: prs.filter(p => !p.isReviewRequested).sort(byTime) },
  ].filter(s => s.prs.length);
}

function listScreen() {
  const sections = prSections();
  const flat = sections.flatMap(s => s.prs);
  cursor = Math.min(cursor, Math.max(flat.length - 1, 0));
  let index = 0;
  const body = sections.map(section => [
    el('div', { class: 'section' }, section.title, el('span', { class: 'count' }, section.prs.length)),
    section.prs.map(pr => {
      const i = index++;
      return el('div', {
        class: 'pr' + (i === cursor ? ' active' : ''),
        onclick: () => { cursor = i; select(pr.number); },
        onmousemove: () => { if (cursor !== i) { cursor = i; render(); } },
      },
        el('span', { class: 'num' }, `#${pr.number}`),
        el('span', { class: 'title', title: pr.title }, pr.title),
        el('span', { class: 'author' }, pr.author),
        el('span', { class: 'when', title: pr.updatedAt || '' }, ago(pr.updatedAt)),
        el('span', { class: 'size' }, el('span', { class: 'plus' }, `+${pr.additions}`), ' ', el('span', { class: 'minus' }, `−${pr.deletions}`)),
      );
    }),
  ]);
  return [
    el('header', {},
      el('h1', {}, '리뷰할 PR 선택'), el('span', { class: 'meta' }, state.repo),
      el('span', { class: 'spacer' }),
      el('span', { class: 'meta' }, `열린 PR ${flat.length}개`),
      el('button', { class: 'btn', onclick: closePage }, '닫기')),
    el('div', { class: 'scroll' }, el('div', { class: 'list' },
      flat.length ? body : el('div', { class: 'empty-state' }, '열린 PR이 없습니다.'))),
    el('div', { class: 'statusbar' },
      hint(kbd('↑', '↓'), '이동'), hint(kbd('Enter'), '리뷰 시작'), hint(kbd('Esc'), '닫기'),
      el('span', { class: 'notice', id: 'notice' }, notice)),
  ];
}

// ------------------------------------------------------------ 상태 화면

function waitScreen(title, text, cancellable) {
  return [
    el('header', {}, prTitle()),
    el('div', { class: 'center' },
      el('div', { class: 'spinner' }), el('h2', {}, title), el('p', {}, text),
      el('span', { class: 'notice', id: 'notice' }, notice),
      cancellable ? el('button', { class: 'btn', onclick: cancel }, '리뷰 취소', el('kbd', {}, 'Esc')) : null),
  ];
}

function doneScreen() {
  return [
    el('header', {}, prTitle()),
    el('div', { class: 'center' },
      el('div', { class: 'mark' }, '✓'), el('h2', {}, '리뷰를 게시했습니다'),
      state.url ? el('a', { href: state.url, target: '_blank', rel: 'noopener noreferrer' }, state.url) : null,
      el('p', {}, '이 탭은 닫아도 됩니다.')),
  ];
}

function endScreen(title, text, isError) {
  return [
    el('header', {}, state.number ? prTitle() : el('h1', {}, 'PR 리뷰')),
    el('div', { class: 'center' + (isError ? ' error' : '') },
      isError ? el('div', { class: 'mark' }, '!') : null,
      el('h2', {}, title), el('p', {}, text || ''),
      el('p', {}, isError ? '오류와 게시하려던 내용은 Claude Code 대화창에도 남겨 두었습니다.' : '이 탭은 닫아도 됩니다.')),
  ];
}

// ------------------------------------------------------------ 피드백 편집 화면

function locText(item) {
  return item.startLine && item.startLine !== item.line ? `${item.startLine}-${item.line}` : `${item.line}`;
}

function feedbackScreen() {
  const review = state.review;
  const items = draft.order;
  draft.cursor = Math.min(draft.cursor, Math.max(items.length - 1, 0));
  const count = chosen().length;

  const list = SEVERITIES.map(sev => {
    const group = items.filter(item => item.severity === sev);
    if (!group.length) return null;
    return [
      el('div', { class: 'section ' + sev }, el('span', { class: 'sev' }, el('span', { class: 'dot' }), sev), el('span', { class: 'count' }, group.length)),
      group.map(item => {
        const i = items.indexOf(item);
        return el('div', {
          class: 'item' + (i === draft.cursor ? ' active' : '') + (draft.selected[item.id] ? '' : ' off'),
          title: `${item.path}:${locText(item)}`,
          onclick: () => { draft.cursor = i; draft.editing = null; render(); },
        },
          el('input', {
            type: 'checkbox', checked: !!draft.selected[item.id], tabindex: '-1',
            onclick: e => { e.stopPropagation(); draft.selected[item.id] = e.target.checked; draft.cursor = i; render(); },
          }),
          el('span', { class: 'loc' }, basename(item.path), el('span', { class: 'line' }, ':' + locText(item))));
      }),
    ];
  });

  const item = current();
  const events = EVENTS.map((ev, i) => el('button', {
    class: draft.event === ev.value ? 'on' : '', tabindex: '-1',
    disabled: review.isOwnPr && ev.value !== 'COMMENT',
    onclick: () => { draft.event = ev.value; render(); },
  }, el('kbd', {}, String(i + 1)), ev.label,
    !review.isOwnPr && review.recommendedEvent === ev.value ? el('span', { class: 'rec' }, '추천') : null));

  return [
    el('header', {}, prTitle(),
      el('span', { class: 'spacer' }),
      el('span', { class: 'notice', id: 'notice' }, notice),
      el('span', { class: 'meta' }, `피드백 ${items.length}개 중 ${count}개 게시`),
      el('button', { class: 'btn', onclick: cancel }, '취소'),
      el('button', { class: 'btn primary', onclick: publish }, count ? `게시 ${count}개` : '게시', el('kbd', {}, `${MOD}↵`))),
    el('main', {},
      el('div', { class: 'items' }, items.length ? list : el('div', { class: 'empty-state' }, '피드백 없음')),
      el('div', { class: 'detail' }, item ? fileOf(item)
        : el('div', { class: 'empty-state' }, '줄에 달 피드백이 없습니다. 전체 의견만 게시하거나 취소할 수 있습니다.'))),
    el('div', { class: 'bottom' },
      el('label', {}, '전체 의견',
        el('textarea', {
          id: 'summary', rows: 1, value: draft.summary, placeholder: '비워 두면 전체 의견 없이 게시합니다.',
          oninput: e => { draft.summary = e.target.value; },
        })),
      el('div', { class: 'result' }, '리뷰 결과', el('div', { class: 'seg' }, events),
        review.isOwnPr ? el('span', { class: 'muted', style: 'font-weight:400' }, '내 PR은 코멘트로만 게시합니다.') : null)),
    el('div', { class: 'statusbar' },
      hint(kbd('↑', '↓'), '이동'), hint(kbd('Space'), '게시 여부'), hint(kbd('Enter'), '본문 편집'),
      hint(kbd('Tab'), '제안 코드 편집'), hint(kbd('Esc'), '편집 끝내기'), hint(kbd('s'), '전체 의견'),
      hint(kbd('1', '2', '3'), '리뷰 결과'), hint(kbd(MOD, 'Enter'), '게시')),
  ];
}

// 피드백이 가리키는 줄(바뀐 뒤 기준)의 원래 내용
function targetLines(item) {
  const hunk = hunkOf(item);
  if (!hunk) return [];
  const from = item.startLine || item.line;
  return hunk.lines.filter(l => l.n !== null && l.n >= from && l.n <= item.line).map(l => l.s);
}

function hunkOf(item) {
  const hunks = (state.files && state.files[item.path]) || [];
  const from = item.startLine || item.line;
  return hunks.find(h => h.newStart <= from && item.line <= h.newStart + h.newCount - 1);
}

function fileOf(item) {
  const hunk = hunkOf(item);
  const head = el('div', { class: 'file-head' }, el('span', { class: 'badge ' + item.severity }, item.severity),
    el('span', {}, item.path, el('span', { class: 'muted' }, ':' + locText(item))));
  if (!hunk) return el('div', { class: 'file' }, head, el('div', { class: 'empty-state' }, '이 줄의 diff를 찾지 못했습니다.'), cardOf(item));

  const from = item.startLine || item.line;
  const lines = hunk.lines;
  const marked = lines.map(l => l.n !== null && l.n >= from && l.n <= item.line);
  const first = marked.indexOf(true);
  const last = marked.lastIndexOf(true);
  const lo = Math.max(0, first - CONTEXT);
  const hi = Math.min(lines.length - 1, last + CONTEXT);

  const rows = [el('tr', { class: 'hunk' }, el('td', { colspan: '4' }, hunk.header))];
  if (lo > 0) rows.push(el('tr', { class: 'gap' }, el('td', { colspan: '4' }, `⋯ ${lo}줄 생략`)));
  for (let i = lo; i <= hi; i++) {
    const l = lines[i];
    const cls = (l.t === '+' ? 'add' : l.t === '-' ? 'del' : '') + (marked[i] ? ' hl' : '');
    rows.push(el('tr', { class: cls },
      el('td', { class: 'no' }, l.o ?? ''), el('td', { class: 'no' }, l.n ?? ''),
      el('td', { class: 'sign' }, l.t === ' ' ? '' : l.t), el('td', {}, l.s)));
    if (i === last) rows.push(el('tr', { class: 'slot' }, el('td', { colspan: '4' }, cardOf(item))));
  }
  if (hi < lines.length - 1) rows.push(el('tr', { class: 'gap' }, el('td', { colspan: '4' }, `⋯ ${lines.length - 1 - hi}줄 생략`)));
  return el('div', { class: 'file' }, head, el('table', { class: 'diff' }, el('tbody', {}, rows)));
}

function grow(box) {
  box.style.height = 'auto';
  box.style.height = box.scrollHeight + 2 + 'px';
}

function cardOf(item) {
  const on = draft.selected[item.id];
  const editing = draft.editing;
  const body = draft.bodies[item.id];
  const suggestion = draft.suggestions[item.id];

  const bodyPart = editing === 'body'
    ? el('textarea', { id: 'body', rows: 3, value: body, oninput: e => { draft.bodies[item.id] = e.target.value; grow(e.target); } })
    : el('div', { class: 'card-body' + (body.trim() ? '' : ' empty'), onclick: () => edit('body') }, body.trim() ? inline(body) : '본문이 비어 있습니다. Enter를 눌러 쓰세요.');

  let suggPart;
  if (editing === 'suggestion') {
    suggPart = el('textarea', {
      id: 'suggestion', class: 'codebox', rows: 2, value: suggestion, spellcheck: 'false',
      placeholder: '이 줄을 대체할 코드. 비우면 제안 코드 없이 게시합니다.',
      oninput: e => { draft.suggestions[item.id] = e.target.value; grow(e.target); },
    });
  } else if (suggestion.trim()) {
    const rows = [
      ...targetLines(item).map(s => el('tr', { class: 'del' }, el('td', { class: 'sign' }, '-'), el('td', {}, s))),
      ...suggestion.replace(/\n+$/, '').split('\n').map(s => el('tr', { class: 'add' }, el('td', { class: 'sign' }, '+'), el('td', {}, s))),
    ];
    suggPart = el('div', { class: 'sugg', onclick: () => edit('suggestion') },
      el('div', { class: 'sugg-head' }, '제안 코드', el('span', { class: 'spacer' }), el('span', {}, 'Tab으로 편집')),
      el('table', { class: 'diff' }, el('tbody', {}, rows)));
  } else {
    suggPart = el('div', { class: 'sugg-empty', onclick: () => edit('suggestion') }, '제안 코드 없음 · Tab으로 추가');
  }

  return el('div', { class: `card ${item.severity}` + (on ? '' : ' off') + (editing ? ' editing' : '') },
    el('div', { class: 'card-head' },
      el('span', { class: 'badge ' + item.severity }, item.severity),
      on ? null : el('span', { class: 'off-tag' }, '게시하지 않음 · Space로 다시 포함')),
    bodyPart, suggPart,
    editing ? el('div', { class: 'card-foot' }, el('kbd', {}, 'Esc'), ' 편집 끝내기  ', el('kbd', {}, 'Tab'), editing === 'body' ? ' 제안 코드로' : ' 본문으로') : null);
}

function edit(part) {
  draft.editing = part;
  render();
}

// ------------------------------------------------------------ 키보드

function typing() {
  const a = document.activeElement;
  return a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT');
}

document.addEventListener('keydown', e => {
  if (!state) return;
  const mod = e.metaKey || e.ctrlKey;

  if (state.phase === 'feedback' && mod && e.key === 'Enter') {
    e.preventDefault();
    draft.editing = null;
    if (typing()) document.activeElement.blur();
    publish();
    return;
  }
  if (typing()) {
    const id = document.activeElement.id;
    if (e.key === 'Escape') {
      e.preventDefault();
      if (draft) draft.editing = null;
      document.activeElement.blur();
      render();
    } else if (e.key === 'Tab' && (id === 'body' || id === 'suggestion')) {
      e.preventDefault();
      edit(id === 'body' ? 'suggestion' : 'body');
    }
    return;
  }
  if (mod || e.altKey) return;

  if (state.phase === 'list') {
    const flat = prSections().flatMap(s => s.prs);
    if (e.key === 'ArrowDown' || e.key === 'j') { cursor = Math.min(cursor + 1, flat.length - 1); render(); }
    else if (e.key === 'ArrowUp' || e.key === 'k') { cursor = Math.max(cursor - 1, 0); render(); }
    else if (e.key === 'Enter' && flat.length) select(flat[cursor].number);
    else if (e.key === 'Escape') closePage();
    else return;
    e.preventDefault();
    return;
  }

  if (state.phase === 'reviewing' && e.key === 'Escape') { e.preventDefault(); cancel(); return; }

  if (state.phase !== 'feedback') return;
  const items = draft.order;
  const item = current();
  if (e.key === 'ArrowDown' || e.key === 'j') draft.cursor = Math.min(draft.cursor + 1, items.length - 1);
  else if (e.key === 'ArrowUp' || e.key === 'k') draft.cursor = Math.max(draft.cursor - 1, 0);
  else if (e.key === ' ' && item) draft.selected[item.id] = !draft.selected[item.id];
  else if (e.key === 'Enter' && item) draft.editing = 'body';
  else if (e.key === 'Tab' && item) draft.editing = 'suggestion';
  else if (e.key === 's') { e.preventDefault(); return focusEnd('summary'); }
  else if (['1', '2', '3'].includes(e.key)) {
    const ev = EVENTS[Number(e.key) - 1].value;
    if (state.review.isOwnPr && ev !== 'COMMENT') return say('내 PR은 코멘트로만 게시할 수 있습니다.');
    draft.event = ev;
  } else return;
  e.preventDefault();
  render();
});

function focusEnd(id) {
  const box = document.getElementById(id);
  if (!box) return;
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
  if (id !== 'summary') grow(box);
}

poll();
polling = setInterval(poll, 1000);
</script>
</body>
</html>
